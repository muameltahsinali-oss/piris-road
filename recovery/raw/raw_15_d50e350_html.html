<section class="pr-hero">

<style>
.pr-hero *{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

.pr-hero{
  position:relative;
  min-height:100vh;
  background:linear-gradient(135deg,#3d63f5,#3558e6);
  color:#fff;
  overflow:hidden;
  padding:80px  0%;
  display:flex;
  align-items:center;
  border-bottom-left-radius:120px;
  border-bottom-right-radius:120px;
}

/* ===== الشريط الجانبي ===== */

.pr-hero .side-layer{
  position:absolute;
  left:20px;
  top:0;
  width:140px;
  height:100%;
  background:linear-gradient(180deg,#2f4fd1,#2745b8);
  border-radius:60px;
}

/* ===== Marquee ===== */

.pr-hero .marquee{
  position:absolute;
  top:0;
  left:20px;
  width:60px;
  height:100%;
  background:#fff;
  writing-mode:vertical-rl;
  text-orientation:mixed;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:600;
  color:#3558e6;
  font-size:14px;
  border-top-right-radius:40px;
  border-bottom-right-radius:40px;
  padding:20px 0;
}

/* ===== PirisRoad خلفي ===== */

/* ===== المحتوى ===== */

.pr-hero .hero-content{
  width:100%;
  display:flex;
  justify-content:space-between;
  align-items:center;
padding-left: 114px ;
  gap:60px;
}

/* النص */

.pr-hero .hero-text{
  max-width:550px;
}

.pr-hero h1{
  font-size:clamp(48px,5vw,70px);
  line-height:1.1;
  margin-bottom:25px;
}

.pr-hero p{
  font-size:18px;
  line-height:1.7;
  opacity:.9;
}

/* ===== الصورة باليمين ===== */

.pr-hero .container-img{
width: 480px;
  transform:rotate(-8deg);
  filter:drop-shadow(0 40px 40px rgba(0,0,0,0.3));
}

/* ===== CTA أصغر ===== */

.pr-hero .contact-box{
  background:linear-gradient(145deg,rgba(255,255,255,.35),rgba(255,255,255,.2));
  backdrop-filter:blur(20px);
  padding:35px;
  border-radius:28px;
  width:300px;
  text-align:center;
  box-shadow:0 25px 50px rgba(0,0,0,.25);
}

.pr-hero .contact-box h3{
  margin-bottom:20px;
  font-weight:500;
  font-size:18px;
}

.pr-hero .contact-btn{
  background:#ffc400;
  border:none;
  padding:14px 22px;
  font-weight:600;
  border-radius:12px;
  cursor:pointer;
  font-size:14px;
  transition:.3s ease;
}

.pr-hero .contact-btn:hover{
  transform:translateY(-3px);
  box-shadow:0 12px 30px rgba(0,0,0,.3);
}

.pr-hero small{
  display:block;
  margin-top:18px;
  font-size:13px;
  opacity:.85;
}

/* ===== Responsive ===== */

@media(max-width:1100px){

  .pr-hero{
    padding:60px 6%;
  }

  .pr-hero .hero-content{
    flex-direction:column;
    padding-left:0;
    text-align:center;
  }

  .pr-hero .vertical-brand,
  .pr-hero .marquee,
  .pr-hero .side-layer{
    display:none;
  }

  /* الصورة تبقى ظاهرة بالموبايل */
  .pr-hero .container-img{
    width:260px;
    margin-top:30px;
    transform:rotate(-6deg);
  }

  .pr-hero .contact-box{
    width:100%;
    max-width:320px;
  }

  .pr-hero{
    border-bottom-left-radius:60px;
    border-bottom-right-radius:60px;
  }
}
/* ===== Cinematic Animations ===== */

@keyframes fadeSlideLeftBlur {
  0% {
    opacity: 0;
    transform: translateX(-100px);
    filter: blur(12px);
  }
  100% {
    opacity: 1;
    transform: translateX(0);
    filter: blur(0);
  }
}

@keyframes fadeSlideRightBlur {
  0% {
    opacity: 0;
    transform: translateX(100px) rotate(-12deg) scale(0.92);
    filter: blur(12px);
  }
  100% {
    opacity: 1;
    transform: translateX(0) rotate(-8deg) scale(1);
    filter: blur(0);
  }
}

@keyframes fadeUpBlur {
  0% {
    opacity: 0;
    transform: translateY(70px);
    filter: blur(10px);
  }
  100% {
    opacity: 1;
    transform: translateY(0);
    filter: blur(0);
  }
}

/* ===== Apply Animations with Delay ===== */

.pr-hero .hero-text {
  opacity: 0;
  animation: fadeSlideLeftBlur 1.4s cubic-bezier(.2,.8,.2,1) forwards;
  animation-delay: 1.1s; /* تأخير حتى يخلص اللودر */
}

.pr-hero .container-img {
  opacity: 0;
  animation: fadeSlideRightBlur 1.6s cubic-bezier(.2,.8,.2,1) forwards;
  animation-delay: 1.4s;
}

.pr-hero .contact-box {
  opacity: 0;
  animation: fadeUpBlur 1.2s ease forwards;
  animation-delay: 1.8s;
}
</style>

<div class="side-layer"></div>

<div class="marquee">
  Meet Local Expertise Engineering Smarter Logistics Solutions Built On Trust
</div>


<div class="hero-content">

  <!-- النص -->
  <div class="hero-text">
    <h1>Driving Logistics<br>Excellence</h1>
    <p>
      Reliable multimodal transportation, customs clearance,
      and supply chain management for complex and
      time-critical shipments.
    </p>
  </div>
    <!-- الصورة باليمين -->
  <img class="container-img"
  src="https://aquamarine-gnat-712272.hostingersite.com/wp-content/uploads/2026/03/Untitled-design-223-scaled-1.webp"
  alt="Shipping Container">
  <!-- CTA -->
  <div class="contact-box">
    <h3> Want to Work With Us?</h3>
    <button class="contact-btn">Contact Us</button>
    <small>Or Email Us at info@pirisroad.iq </small>
  </div>




</div>

</section>
